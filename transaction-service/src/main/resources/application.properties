server.port=8082
spring.application.name=transaction-service
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:h2:mem:transactions
spring.jpa.hibernate.ddl-auto=update
spring.graphql.graphiql.enabled=true

spring.ai.mcp.server.name=transaction-mcp
spring.ai.mcp.server.version=1.0.0

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException.NotFound,feign.FeignException.BadRequest
resilience4j.timelimiter.configs.default.timeout-duration=3s